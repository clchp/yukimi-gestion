name: Agent inspect sales drafts

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-inspect-sales.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - name: Extraer contexto de borradores
        run: |
          {
            echo '# sales-api.ts'
            sed -n '1,260p' apps/web/src/features/sales/sales-api.ts
            echo '\n# shared sales draft symbols'
            grep -Rni -A 45 -B 10 'sale.*draft\|draft.*sale' packages/shared/src apps/api/src/modules/sales apps/web/src/pages/new-sale-page.tsx | head -n 700 || true
            echo '\n# migration 034 draft area'
            grep -n -A 260 -B 40 'sale_drafts' supabase/migrations/034_compliance_closure.sql | head -n 700 || true
          } > docs/.agent-sales-inspection.txt
      - name: Publicar inspección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.agent-sales-inspection.txt
          git commit -m "chore(agent): guardar inspección temporal de borradores"
          git push origin HEAD:version-1-1
