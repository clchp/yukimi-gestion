name: Agent upgrade native selects

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-upgrade-native-selects.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Convertir selectores de páginas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = Path('apps/web/src/pages')
          changed = []
          for file in pages.glob('*.tsx'):
              text = file.read_text(encoding='utf-8')
              if not re.search(r'<select\b', text):
                  continue
              updated = re.sub(r'<select\b', '<SearchableNativeSelect', text)
              updated = updated.replace('</select>', '</SearchableNativeSelect>')
              if updated == text:
                  continue
              if 'SearchableNativeSelect' not in text.split('\n', 40)[0:40]:
                  import_line = "import { SearchableNativeSelect } from '../components/ui/searchable-native-select';\n"
                  matches = list(re.finditer(r'^import .*?;\s*$', updated, flags=re.M))
                  if matches:
                      position = matches[-1].end()
                      updated = updated[:position] + '\n' + import_line.rstrip() + updated[position:]
                  else:
                      updated = import_line + updated
              file.write_text(updated, encoding='utf-8')
              changed.append(str(file))

          global_css = Path('apps/web/src/styles/global.css')
          css = global_css.read_text(encoding='utf-8')
          import_line = "@import './ux-searchable-native.css';"
          if import_line not in css:
              imports = list(re.finditer(r"^@import .*?;\s*$", css, flags=re.M))
              if imports:
                  position = imports[-1].end()
                  css = css[:position] + '\n' + import_line + css[position:]
              else:
                  css = import_line + '\n' + css
              global_css.write_text(css, encoding='utf-8')

          Path('docs/.agent-select-upgrade-report.md').write_text(
              '# Selectores heredados convertidos\n\n' +
              ('\n'.join(f'- `{file}`' for file in changed) if changed else '- No se encontraron selectores nativos en páginas.') +
              '\n',
              encoding='utf-8',
          )
          PY
      - name: Formatear y corregir lint seguro
        run: |
          npx prettier --write apps/web/src/pages apps/web/src/components/ui/searchable-native-select.tsx apps/web/src/styles/global.css apps/web/src/styles/ux-searchable-native.css docs/.agent-select-upgrade-report.md
          npx eslint apps/web/src/pages apps/web/src/components/ui/searchable-native-select.tsx --fix || true
      - name: Publicar selectores buscables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages apps/web/src/styles/global.css apps/web/src/styles/ux-searchable-native.css apps/web/src/components/ui/searchable-native-select.tsx docs/.agent-select-upgrade-report.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "feat(ux): convertir selectores heredados en buscables"
          git push origin HEAD:version-1-1
