name: Hotfix safe React runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-safe-react-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desactivar solo mutaciones DOM conflictivas
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('apps/web/src/app/runtime-ux-enhancements.ts')
          text = runtime.read_text()
          old = "function runEnhancements() {\n  enhanceDashboard();"
          new = "function runEnhancements() {\n  // El dashboard ya es React nativo; no modificar sus nodos por fuera de React."
          if old not in text:
              raise SystemExit('No se encontró enhanceDashboard en runtime-ux-enhancements')
          runtime.write_text(text.replace(old, new, 1))

          pending = Path('apps/web/src/app/pending-workflow-enhancements.ts')
          text = pending.read_text()
          old = "function runPendingEnhancements() {\n  enhanceDashboard();"
          new = "function runPendingEnhancements() {\n  // El dashboard queda bajo control exclusivo de React."
          if old not in text:
              raise SystemExit('No se encontró enhanceDashboard en pending-workflow-enhancements')
          text = text.replace(old, new, 1)
          old = "  void enhanceSaleVipStatus();"
          new = "  // El estado VIP se representa desde el flujo seguro de pagos; evitar tarjetas DOM duplicadas."
          if old not in text:
              raise SystemExit('No se encontró enhanceSaleVipStatus en pending-workflow-enhancements')
          pending.write_text(text.replace(old, new, 1))
          PY
      - name: Eliminar workflow temporal y confirmar cambios
        run: |
          rm .github/workflows/hotfix-safe-react-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/runtime-ux-enhancements.ts apps/web/src/app/pending-workflow-enhancements.ts .github/workflows/hotfix-safe-react-runtime.yml
          git commit -m "fix: evitar mutaciones DOM conflictivas en inicio y VIP"
          git push origin main
