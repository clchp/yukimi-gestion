name: Apply import revalidation fixes

on:
  push:
    branches:
      - fix/importaciones-revalidacion-final
    paths:
      - automation/apply-import-revalidation.py

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply automated import fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/importaciones-revalidacion-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply source changes
        run: python3 automation/apply-import-revalidation.py
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npm run format
      - name: Validate types and build
        run: |
          npm run build:shared
          npm run typecheck
          npm test
          npm run build
      - name: Commit generated changes
        run: |
          rm -f automation/apply-import-revalidation.py
          rm -f .github/workflows/apply-import-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(imports): apply automated import fixes" || exit 0
          git push origin HEAD:fix/importaciones-revalidacion-final
