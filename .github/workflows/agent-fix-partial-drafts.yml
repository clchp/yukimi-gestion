name: Agent fix partial sale drafts

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-fix-partial-drafts.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Corregir contratos y funciones de borradores parciales
        run: |
          python - <<'PY'
          from pathlib import Path

          sales = Path('packages/shared/src/sales.ts')
          text = sales.read_text(encoding='utf-8')
          start = text.index('export const saleDraftSummarySchema')
          end = text.index('export const createReturnCaseSchema', start)
          block = """export const saleDraftPayloadSchema = z
            .object({
              clientId: z.preprocess(
                (value) => (value === '' || value === undefined ? null : value),
                z.string().uuid().nullable(),
              ),
              salesChannelCode: z.string().trim().min(1).max(50).default('WHATSAPP'),
              currencyCode: z.literal('PEN').default('PEN'),
              deliveryMode: z.enum(['PENDING', 'ACCUMULATED']).default('PENDING'),
              dueAt: z.string().datetime().nullable().optional(),
              dueDateReason: z.string().trim().max(500).nullable().optional(),
              saleTypeCode: z.enum(['REGULAR', 'CUSTOM_ORDER']).default('REGULAR'),
              negotiatedMinimumDepositAmount: z.number().nonnegative().nullable().optional(),
              negotiatedMinimumDepositReason: z.string().trim().max(500).nullable().optional(),
              notes: z.string().trim().max(2000).nullable().optional(),
              items: z.array(createSaleItemSchema).max(100).default([]),
            })
            .superRefine((value, context) => {
              if (value.dueAt && (!value.dueDateReason || value.dueDateReason.trim().length < 5)) {
                context.addIssue({
                  code: 'custom',
                  path: ['dueDateReason'],
                  message: 'Explica por qué se usa un vencimiento personalizado.',
                });
              }
              if (
                value.negotiatedMinimumDepositAmount != null &&
                (!value.negotiatedMinimumDepositReason ||
                  value.negotiatedMinimumDepositReason.trim().length < 3)
              ) {
                context.addIssue({
                  code: 'custom',
                  path: ['negotiatedMinimumDepositReason'],
                  message: 'Explica el acuerdo del adelanto mínimo.',
                });
              }
            });
          export type SaleDraftPayload = z.infer<typeof saleDraftPayloadSchema>;

          export const saleDraftSummarySchema = z.object({
            id: z.string().uuid(),
            code: z.string(),
            clientId: z.string().uuid().nullable(),
            clientName: z.string(),
            status: z.enum(['DRAFT', 'CONFIRMED', 'CANCELLED']),
            totalAmount: z.number().nonnegative(),
            itemLines: z.number().int().nonnegative(),
            updatedAt: z.string(),
            version: z.number().int().positive(),
          });
          export type SaleDraftSummary = z.infer<typeof saleDraftSummarySchema>;

          export const saleDraftDetailSchema = saleDraftSummarySchema.extend({
            payload: saleDraftPayloadSchema,
            confirmedSaleId: z.string().uuid().nullable(),
          });
          export type SaleDraftDetail = z.infer<typeof saleDraftDetailSchema>;

          export const saleDraftListSchema = z.object({
            items: z.array(saleDraftSummarySchema),
          });
          export type SaleDraftList = z.infer<typeof saleDraftListSchema>;

          export const saveSaleDraftSchema = z.object({
            draftId: z.string().uuid().nullable().optional(),
            input: saleDraftPayloadSchema,
            version: z.number().int().positive().nullable().optional(),
          });
          export type SaveSaleDraftInput = z.infer<typeof saveSaleDraftSchema>;

          """
          sales.write_text(text[:start] + block + text[end:], encoding='utf-8')

          Path('supabase/migrations/043_partial_sale_draft_functions.sql').write_text("""-- Yukimi Gestión
          -- Migración 043: borradores de venta realmente parciales.

          begin;

          create or replace function public.save_sale_draft_v1(
            p_input jsonb,
            p_draft_id uuid default null,
            p_expected_version bigint default null
          )
          returns jsonb
          language plpgsql
          security definer
          set search_path = ''
          as $$
          declare
            v_actor uuid := private.current_actor_id();
            v_draft public.sale_drafts%rowtype;
            v_client_id uuid;
            v_items jsonb;
            v_total numeric(14,2);
            v_lines integer;
          begin
            if not private.is_active_admin() then
              raise exception 'Usuario no autorizado.' using errcode = '42501';
            end if;
            if jsonb_typeof(p_input) <> 'object' then
              raise exception 'El borrador de venta no tiene un formato válido.';
            end if;

            v_items := coalesce(p_input -> 'items', '[]'::jsonb);
            if jsonb_typeof(v_items) <> 'array' then
              raise exception 'Los productos del borrador no tienen un formato válido.';
            end if;

            if nullif(p_input ->> 'clientId', '') is not null then
              begin
                v_client_id := (p_input ->> 'clientId')::uuid;
              exception when invalid_text_representation then
                raise exception 'El cliente del borrador no tiene un identificador válido.' using errcode = 'P0001';
              end;

              perform 1
              from public.clients
              where id = v_client_id and is_active = true;
              if not found then
                raise exception 'El cliente no existe o está inactivo.' using errcode = 'P0001';
              end if;
            end if;

            select
              coalesce(sum(
                greatest(0, coalesce((item ->> 'quantity')::integer, 0))
                * greatest(0, coalesce((item ->> 'finalUnitPrice')::numeric, 0))
              ), 0),
              count(*)::integer
            into v_total, v_lines
            from jsonb_array_elements(v_items) item;

            perform set_config(
              'app.audit_reason',
              case
                when p_draft_id is null then 'Creación de borrador de venta'
                else 'Actualización de borrador de venta'
              end,
              true
            );

            if p_draft_id is null then
              insert into public.sale_drafts(
                code, client_id, payload, total_amount, item_lines, created_by, updated_by
              ) values (
                public.next_business_code('SALE_DRAFT'),
                v_client_id,
                p_input || jsonb_build_object('clientId', v_client_id, 'items', v_items),
                round(v_total, 2),
                v_lines,
                v_actor,
                v_actor
              ) returning * into v_draft;
            else
              update public.sale_drafts
              set client_id = v_client_id,
                  payload = p_input || jsonb_build_object('clientId', v_client_id, 'items', v_items),
                  total_amount = round(v_total, 2),
                  item_lines = v_lines,
                  updated_by = v_actor
              where id = p_draft_id
                and status = 'DRAFT'
                and (p_expected_version is null or version = p_expected_version)
              returning * into v_draft;

              if not found then
                raise exception 'El borrador cambió, fue confirmado o ya no existe. Recarga antes de continuar.' using errcode = '40001';
              end if;
            end if;

            return jsonb_build_object(
              'id', v_draft.id,
              'code', v_draft.code,
              'clientId', v_draft.client_id,
              'clientName', coalesce(
                (select full_name from public.clients where id = v_draft.client_id),
                'Sin cliente'
              ),
              'status', v_draft.status,
              'totalAmount', v_draft.total_amount,
              'itemLines', v_draft.item_lines,
              'payload', v_draft.payload,
              'confirmedSaleId', v_draft.confirmed_sale_id,
              'updatedAt', v_draft.updated_at,
              'version', v_draft.version
            );
          end;
          $$;

          create or replace function public.list_sale_drafts_v1()
          returns jsonb
          language plpgsql
          stable
          security definer
          set search_path = ''
          as $$
          begin
            if not private.is_active_admin() then
              raise exception 'Usuario no autorizado.' using errcode = '42501';
            end if;
            return jsonb_build_object(
              'items', coalesce((
                select jsonb_agg(jsonb_build_object(
                  'id', d.id,
                  'code', d.code,
                  'clientId', d.client_id,
                  'clientName', coalesce(c.full_name, 'Sin cliente'),
                  'status', d.status,
                  'totalAmount', d.total_amount,
                  'itemLines', d.item_lines,
                  'updatedAt', d.updated_at,
                  'version', d.version
                ) order by d.updated_at desc)
                from public.sale_drafts d
                left join public.clients c on c.id = d.client_id
                where d.status = 'DRAFT'
              ), '[]'::jsonb)
            );
          end;
          $$;

          create or replace function public.get_sale_draft_v1(p_draft_id uuid)
          returns jsonb
          language plpgsql
          stable
          security definer
          set search_path = ''
          as $$
          declare
            v_draft public.sale_drafts%rowtype;
          begin
            if not private.is_active_admin() then
              raise exception 'Usuario no autorizado.' using errcode = '42501';
            end if;
            select * into v_draft from public.sale_drafts where id = p_draft_id;
            if not found then
              raise exception 'El borrador no existe.' using errcode = 'P0002';
            end if;
            return jsonb_build_object(
              'id', v_draft.id,
              'code', v_draft.code,
              'clientId', v_draft.client_id,
              'clientName', coalesce(
                (select full_name from public.clients where id = v_draft.client_id),
                'Sin cliente'
              ),
              'status', v_draft.status,
              'totalAmount', v_draft.total_amount,
              'itemLines', v_draft.item_lines,
              'payload', v_draft.payload,
              'confirmedSaleId', v_draft.confirmed_sale_id,
              'updatedAt', v_draft.updated_at,
              'version', v_draft.version
            );
          end;
          $$;

          create or replace function public.confirm_sale_draft_v1(
            p_draft_id uuid,
            p_expected_version bigint,
            p_idempotency_key text
          )
          returns jsonb
          language plpgsql
          security definer
          set search_path = ''
          as $$
          declare
            v_draft public.sale_drafts%rowtype;
            v_result jsonb;
          begin
            if not private.is_active_admin() then
              raise exception 'Usuario no autorizado.' using errcode = '42501';
            end if;
            select * into v_draft
            from public.sale_drafts
            where id = p_draft_id and status = 'DRAFT'
            for update;
            if not found or v_draft.version <> p_expected_version then
              raise exception 'El borrador cambió o ya fue confirmado.' using errcode = '40001';
            end if;
            if v_draft.client_id is null then
              raise exception 'Selecciona un cliente antes de confirmar la venta.' using errcode = 'P0001';
            end if;
            if jsonb_typeof(v_draft.payload -> 'items') <> 'array'
               or jsonb_array_length(v_draft.payload -> 'items') = 0 then
              raise exception 'Agrega al menos un producto antes de confirmar la venta.' using errcode = 'P0001';
            end if;

            v_result := public.create_sale_v3(v_draft.payload, p_idempotency_key);
            perform set_config('app.audit_reason', 'Confirmación de borrador y reserva atómica de stock', true);
            update public.sale_drafts
            set status = 'CONFIRMED',
                confirmed_sale_id = (v_result ->> 'id')::uuid,
                updated_by = private.current_actor_id()
            where id = v_draft.id;

            return v_result;
          end;
          $$;

          notify pgrst, 'reload schema';

          commit;
          """.replace('          ', ''), encoding='utf-8')
          PY
      - name: Formatear y validar contratos
        run: |
          npx prettier --write packages/shared/src/sales.ts
          npm run build:shared
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:migrations:static
          npm run test:db:static
      - name: Publicar corrección
        run: |
          rm -f .github/workflows/agent-fix-partial-drafts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sales): permitir borradores parciales y validar al confirmar"
          git pull --rebase origin version-1-1
          git push origin HEAD:version-1-1
