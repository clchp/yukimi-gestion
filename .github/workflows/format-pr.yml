name: Formatear PR temporal

on:
  pull_request:
    branches: [version-1-1]
    paths:
      - 'apps/web/src/app/runtime-ux-enhancements.ts'
      - 'apps/web/src/features/insights/file-export.ts'
      - 'apps/web/src/styles/ux-final-revalidation.css'
      - '.github/workflows/format-pr.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aplicar Prettier
        run: npx prettier --write apps/web/src/app/runtime-ux-enhancements.ts apps/web/src/features/insights/file-export.ts apps/web/src/styles/ux-final-revalidation.css
      - name: Guardar formato
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/runtime-ux-enhancements.ts apps/web/src/features/insights/file-export.ts apps/web/src/styles/ux-final-revalidation.css
          git commit -m "style: aplicar formato automático"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
