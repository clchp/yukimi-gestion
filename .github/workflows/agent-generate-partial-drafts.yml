name: Agent generate partial sale drafts

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-generate-partial-drafts.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generar migración aditiva desde las funciones existentes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('supabase/migrations/034_compliance_closure.sql')
          source = source_path.read_text(encoding='utf-8')
          function_pattern = re.compile(
              r'create\s+or\s+replace\s+function\s+public\.([a-z0-9_]*draft[a-z0-9_]*)\s*\(.*?\n\$\$;\s*',
              re.I | re.S,
          )
          definitions = []
          for match in function_pattern.finditer(source):
              name = match.group(1)
              definition = match.group(0).strip()
              lower_name = name.lower()

              # Las listas y detalles deben conservar los borradores sin cliente.
              definition = re.sub(
                  r'\bjoin\s+public\.clients\b',
                  'left join public.clients',
                  definition,
                  flags=re.I,
              )
              definition = re.sub(
                  r"('clientName'\s*,\s*)c\.name",
                  r"\1coalesce(c.name, 'Sin cliente')",
                  definition,
                  flags=re.I,
              )

              if any(token in lower_name for token in ('save', 'upsert', 'persist')):
                  # Elimina únicamente bloqueos de completitud propios del borrador.
                  def relax_if(match_if):
                      block = match_if.group(0)
                      lower = block.lower()
                      completion_error = (
                          ('cliente' in lower and ('oblig' in lower or 'seleccion' in lower))
                          or ('al menos un producto' in lower)
                          or ('al menos una línea' in lower)
                          or ('array_length' in lower and ('item' in lower or 'line' in lower))
                      )
                      return '' if completion_error else block

                  definition = re.sub(
                      r'\bif\b.*?\bend\s+if\s*;',
                      relax_if,
                      definition,
                      flags=re.I | re.S,
                  )

              definitions.append((name, definition))

          if not definitions:
              raise SystemExit('No se encontraron funciones de borrador en la migración 034.')

          migration = [
              '-- Yukimi Gestión',
              '-- Migración 043: borradores de venta realmente parciales.',
              '',
              'begin;',
              '',
          ]
          for name, definition in definitions:
              migration.append(f'-- Función actualizada: {name}')
              migration.append(definition)
              migration.append('')
          migration.extend([
              "notify pgrst, 'reload schema';",
              '',
              'commit;',
              '',
          ])
          Path('supabase/migrations/043_partial_sale_draft_functions.sql').write_text(
              '\n'.join(migration), encoding='utf-8'
          )

          # Relaja los contratos Zod cuyo nombre contiene Draft/Borrador sin tocar
          # el esquema estricto de confirmación de la venta.
          sales_path = Path('packages/shared/src/sales.ts')
          text = sales_path.read_text(encoding='utf-8')
          declarations = list(re.finditer(
              r'export const\s+([A-Za-z0-9_]*(?:draft|borrador)[A-Za-z0-9_]*)\s*=',
              text,
              re.I,
          ))
          for index in range(len(declarations) - 1, -1, -1):
              match = declarations[index]
              start = match.start()
              end = declarations[index + 1].start() if index + 1 < len(declarations) else len(text)
              block = text[start:end]
              block = re.sub(
                  r'clientId:\s*z\.string\(\)\.uuid\(\)(?!\.(?:nullable|optional))',
                  "clientId: z.preprocess((value) => value === '' ? null : value, z.string().uuid().nullable().optional())",
                  block,
              )
              block = re.sub(
                  r'(items|lines):\s*z\.array\(([^\n;]+)\)\.min\(1(?:,[^)]*)?\)',
                  r'\1: z.array(\2).default([])',
                  block,
              )
              block = re.sub(
                  r'(items|lines):\s*z\.array\(([^\n;]+)\)\.nonempty\([^)]*\)',
                  r'\1: z.array(\2).default([])',
                  block,
              )
              text = text[:start] + block + text[end:]
          sales_path.write_text(text, encoding='utf-8')

          report = [
              '# Generación de borradores parciales',
              '',
              'Funciones regeneradas:',
              *[f'- `{name}`' for name, _ in definitions],
              '',
              'El esquema estricto de confirmación de venta no fue modificado.',
          ]
          Path('docs/.agent-draft-generation-report.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY
      - name: Formatear código compatible
        run: |
          npx prettier --write packages/shared/src/sales.ts docs/.agent-draft-generation-report.md
      - name: Publicar soporte de borradores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/sales.ts supabase/migrations/043_partial_sale_draft_functions.sql docs/.agent-draft-generation-report.md
          git commit -m "feat(sales): permitir borradores parciales sin relajar confirmación"
          git push origin HEAD:version-1-1
