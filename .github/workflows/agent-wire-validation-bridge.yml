name: Agent wire validation bridge

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-wire-validation-bridge.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integrar puente
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('apps/web/src/main.tsx')
          text = main.read_text(encoding='utf-8')
          import_line = "import { GlobalFormValidationBridge } from './components/ui/global-form-validation-bridge';\n"
          if 'GlobalFormValidationBridge' not in text:
              imports_end = text.find('\n\n')
              if imports_end >= 0:
                  text = text[:imports_end+2] + import_line + text[imports_end+2:]
              else:
                  text = import_line + text
              marker = '<FeedbackProvider>'
              if marker in text:
                  text = text.replace(marker, marker + '\n        <GlobalFormValidationBridge />', 1)
              else:
                  raise SystemExit('No se encontró FeedbackProvider en main.tsx')
          main.write_text(text, encoding='utf-8')
          PY
          npx prettier --write apps/web/src/main.tsx apps/web/src/components/ui/global-form-validation-bridge.tsx
      - name: Publicar integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/components/ui/global-form-validation-bridge.tsx
          git commit -m "feat(ux): integrar validación visual en formularios heredados"
          git push origin HEAD:version-1-1
