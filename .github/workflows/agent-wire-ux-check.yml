name: Agent wire UX check

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-wire-ux-check.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Actualizar scripts de verificación
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.scripts ??= {};
          packageJson.scripts['verify:ux'] = 'node scripts/verify-ux-contracts.mjs';
          const verify = String(packageJson.scripts.verify ?? '').trim();
          if (!verify.includes('verify:ux')) {
            packageJson.scripts.verify = verify ? `${verify} && npm run verify:ux` : 'npm run verify:ux';
          }
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
      - name: Publicar integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "test(ux): integrar auditoría transversal en verify"
          git push origin HEAD:version-1-1
