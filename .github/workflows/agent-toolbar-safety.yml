name: Agent toolbar safety

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-toolbar-safety.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reemplazar Toolbar por una versión segura
        run: |
          cat > apps/web/src/components/ui/toolbar.tsx <<'TSX'
          import { Columns3, Search, SlidersHorizontal } from 'lucide-react';
          import type { ReactNode } from 'react';

          interface ToolbarProps {
            placeholder?: string;
            value?: string;
            onChange?: (value: string) => void;
            searchAriaLabel?: string;
            showFilterButton?: boolean;
            onFilterClick?: () => void;
            filterCount?: number;
            showColumnButton?: boolean;
            onColumnsClick?: () => void;
            columnsDisabled?: boolean;
            className?: string;
            children?: ReactNode;
          }

          export function Toolbar({
            placeholder = 'Buscar…',
            value = '',
            onChange,
            searchAriaLabel = 'Buscar',
            showFilterButton = true,
            onFilterClick,
            filterCount = 0,
            showColumnButton = false,
            onColumnsClick,
            columnsDisabled = false,
            className,
            children,
          }: ToolbarProps) {
            return (
              <div className={`table-toolbar ${className ?? ''}`.trim()}>
                <label className="toolbar-search">
                  <Search size={18} />
                  <input
                    aria-label={searchAriaLabel}
                    placeholder={placeholder}
                    value={value}
                    onChange={(event) => onChange?.(event.target.value)}
                  />
                </label>
                <div className="toolbar-actions">
                  {children}
                  {showFilterButton && onFilterClick ? (
                    <button className="button button-secondary button-compact" type="button" onClick={onFilterClick}>
                      <SlidersHorizontal size={16} /> Filtros
                      {filterCount > 0 ? <span className="filter-count-badge">{filterCount}</span> : null}
                    </button>
                  ) : null}
                  {showColumnButton && onColumnsClick ? (
                    <button
                      className="button button-secondary button-compact"
                      type="button"
                      disabled={columnsDisabled}
                      onClick={onColumnsClick}
                    >
                      <Columns3 size={16} /> Columnas
                    </button>
                  ) : null}
                </div>
              </div>
            );
          }
          TSX
          npx prettier --write apps/web/src/components/ui/toolbar.tsx
      - name: Publicar barra segura
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/ui/toolbar.tsx
          git commit -m "fix(ux): ocultar filtros y columnas sin una acción real"
          git push origin HEAD:version-1-1
