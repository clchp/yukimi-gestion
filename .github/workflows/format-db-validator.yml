name: Format DB validator

on:
  push:
    branches:
      - fix/ui-action-release-v1-1-20260808

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-action-release-v1-1-20260808
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/validate-db-tests.mjs
      - name: Commit de formato
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-db-tests.mjs
          git commit -m "style: formatear validador pgTAP"
          git push origin HEAD:fix/ui-action-release-v1-1-20260808
