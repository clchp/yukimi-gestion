name: Agent finalize UX blocks

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-finalize-ux-blocks.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Consolidar cambios transversales
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          # No debe quedar la migración 038 experimental y duplicada.
          Path('supabase/migrations/038_import_receipt_and_cancellation_integrity.sql').unlink(missing_ok=True)

          # Migra únicamente la nulabilidad del cliente del borrador; las funciones
          # se regeneran en 043 desde la implementación original.
          Path('supabase/migrations/041_partial_sale_drafts.sql').write_text("""-- Yukimi Gestión
          -- Migración 041: los borradores pueden guardarse sin cliente mientras no se confirmen.

          begin;

          alter table public.sale_drafts
            alter column client_id drop not null;

          comment on column public.sale_drafts.client_id is
            'Cliente opcional mientras el registro sea un borrador. La venta final exige un cliente válido.';

          notify pgrst, 'reload schema';

          commit;
          """.replace('          ', ''), encoding='utf-8')

          # Motivo para auditoría y recarga de esquema en productos.
          migration = Path('supabase/migrations/037_product_maintenance_and_ux_integrity.sql')
          text = migration.read_text(encoding='utf-8')
          marker = '  v_old_product := to_jsonb(v_product);'
          if marker in text and "app.audit_reason" not in text:
              text = text.replace(marker, "  perform pg_catalog.set_config('app.audit_reason', v_reason, true);\n\n" + marker)
          if "notify pgrst" not in text:
              text = text.replace('\ncommit;\n', "\nnotify pgrst, 'reload schema';\n\ncommit;\n")
          migration.write_text(text, encoding='utf-8')

          # Etiqueta de tamaño real y sin escape de script innecesario.
          label = Path('apps/web/src/features/products/product-label.ts')
          text = label.read_text(encoding='utf-8')
          text = text.replace('const qr = qrSvg(payload, 1);', 'const qr = qrSvg(payload, 348);')
          text = text.replace(r'<\/script>', '</script>')
          label.write_text(text, encoding='utf-8')

          # Importa todos los estilos UX en orden.
          global_css = Path('apps/web/src/styles/global.css')
          text = global_css.read_text(encoding='utf-8')
          text = re.sub(r'\n\.qr-label-preview\s*\{.*?\.qr-label-payload\s*\{.*?\}\s*$', '\n', text, flags=re.S)
          required_styles = [
              './ux.css',
              './ux-dashboard.css',
              './ux-products.css',
              './ux-imports.css',
              './ux-new-import.css',
              './ux-searchable-native.css',
              './ux-interactions.css',
          ]
          for stylesheet in required_styles:
              line = f"@import '{stylesheet}';"
              if line not in text:
                  imports = list(re.finditer(r"^@import .*?;\s*$", text, flags=re.M))
                  position = imports[-1].end() if imports else 0
                  text = text[:position] + ('\n' if position else '') + line + text[position:]
          global_css.write_text(text, encoding='utf-8')

          # Los puentes globales dan validación y traducción a formularios heredados.
          main = Path('apps/web/src/main.tsx')
          text = main.read_text(encoding='utf-8')
          bridge_imports = [
              "import { GlobalFormValidationBridge } from './components/ui/global-form-validation-bridge';",
              "import { GlobalLocalizationBridge } from './components/ui/global-localization-bridge';",
          ]
          for import_line in bridge_imports:
              if import_line not in text:
                  matches = list(re.finditer(r'^import .*?;\s*$', text, flags=re.M))
                  position = matches[-1].end() if matches else 0
                  text = text[:position] + ('\n' if position else '') + import_line + text[position:]
          marker = '<FeedbackProvider>'
          if marker not in text:
              raise SystemExit('No se encontró FeedbackProvider en main.tsx')
          if '<GlobalFormValidationBridge />' not in text:
              text = text.replace(marker, marker + '\n        <GlobalFormValidationBridge />', 1)
          if '<GlobalLocalizationBridge />' not in text:
              text = text.replace('<GlobalFormValidationBridge />', '<GlobalFormValidationBridge />\n        <GlobalLocalizationBridge />', 1)
          main.write_text(text, encoding='utf-8')

          # Toolbar tolerante con aliases heredados y sin botones inertes.
          Path('apps/web/src/components/ui/toolbar.tsx').write_text("""import { Columns3, Search, SlidersHorizontal } from 'lucide-react';
          import type { ReactNode } from 'react';

          interface ToolbarProps {
            [key: string]: unknown;
            placeholder?: string;
            value?: string;
            search?: string;
            onChange?: (value: string) => void;
            onSearchChange?: (value: string) => void;
            onSearch?: (value: string) => void;
            searchAriaLabel?: string;
            showFilterButton?: boolean;
            onFilterClick?: () => void;
            onFiltersClick?: () => void;
            filterCount?: number;
            showColumnButton?: boolean;
            showColumnsButton?: boolean;
            onColumnsClick?: () => void;
            columnsDisabled?: boolean;
            className?: string;
            children?: ReactNode;
          }

          export function Toolbar({
            placeholder = 'Buscar…',
            value,
            search,
            onChange,
            onSearchChange,
            onSearch,
            searchAriaLabel = 'Buscar',
            showFilterButton = true,
            onFilterClick,
            onFiltersClick,
            filterCount = 0,
            showColumnButton = false,
            showColumnsButton = false,
            onColumnsClick,
            columnsDisabled = false,
            className,
            children,
          }: ToolbarProps) {
            const currentValue = value ?? search ?? '';
            const change = onChange ?? onSearchChange ?? onSearch;
            const filterAction = onFilterClick ?? onFiltersClick;
            return (
              <div className={`table-toolbar ${className ?? ''}`.trim()}>
                <label className="toolbar-search">
                  <Search size={18} />
                  <input
                    aria-label={searchAriaLabel}
                    placeholder={placeholder}
                    value={currentValue}
                    onChange={(event) => change?.(event.target.value)}
                  />
                </label>
                <div className="toolbar-actions">
                  {children}
                  {showFilterButton && filterAction ? (
                    <button className="button button-secondary button-compact" type="button" onClick={filterAction}>
                      <SlidersHorizontal size={16} /> Filtros
                      {filterCount > 0 ? <span className="filter-count-badge">{filterCount}</span> : null}
                    </button>
                  ) : null}
                  {(showColumnButton || showColumnsButton) && onColumnsClick ? (
                    <button
                      className="button button-secondary button-compact"
                      type="button"
                      disabled={columnsDisabled}
                      onClick={onColumnsClick}
                    >
                      <Columns3 size={16} /> Columnas
                    </button>
                  ) : null}
                </div>
              </div>
            );
          }
          """.replace('          ', ''), encoding='utf-8')

          # La auditoría prohíbe APIs nativas, no los métodos asincrónicos del proveedor.
          verifier = Path('scripts/verify-ux-contracts.mjs')
          text = verifier.read_text(encoding='utf-8')
          text = re.sub(
              r"\s*const forbidden = \[.*?\];\n\s*for \(const pattern of forbidden\) \{.*?\n\s*\}",
              "\n  const forbidden = /\\b(?:window|globalThis)\\.(?:alert|prompt|confirm)\\s*\\(/g;\n  const match = forbidden.exec(source);\n  if (match) fail(`${fileName}: contiene un diálogo nativo prohibido cerca de “${match[0]}”.`);",
              text,
              flags=re.S,
          )
          for required in [
              "  'apps/web/src/components/ui/global-form-validation-bridge.tsx',\n",
              "  'apps/web/src/components/ui/global-localization-bridge.tsx',\n",
              "  'apps/web/src/components/ui/searchable-native-select.tsx',\n",
              "  'supabase/migrations/043_partial_sale_draft_functions.sql',\n",
          ]:
              if required.strip() not in text:
                  text = text.replace("const requiredFiles = [\n", "const requiredFiles = [\n" + required)
          for stylesheet in ['./ux-searchable-native.css', './ux-interactions.css']:
              literal = f"  '{stylesheet}',\n"
              if literal.strip() not in text:
                  text = text.replace("for (const stylesheet of [\n", "for (const stylesheet of [\n" + literal)
          verifier.write_text(text, encoding='utf-8')

          # Integra verify:ux al comando integral.
          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package.setdefault('scripts', {})['verify:ux'] = 'node scripts/verify-ux-contracts.mjs'
          verify = str(package['scripts'].get('verify', '')).strip()
          if 'verify:ux' not in verify:
              package['scripts']['verify'] = f"{verify} && npm run verify:ux" if verify else 'npm run verify:ux'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          # Limpia importaciones duplicadas introducidas por codemods concurrentes.
          for page in Path('apps/web/src/pages').glob('*.tsx'):
              page_text = page.read_text(encoding='utf-8')
              line = "import { SearchableNativeSelect } from '../components/ui/searchable-native-select';"
              if page_text.count(line) > 1:
                  first = True
                  output = []
                  for current in page_text.splitlines():
                      if current == line:
                          if first:
                              output.append(current)
                              first = False
                          continue
                      output.append(current)
                  page.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Formatear y corregir automáticamente
        run: |
          git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' '*.css' '*.md' '*.json' '*.yml' '*.yaml' | xargs npx prettier --write
          npx eslint apps packages scripts --fix || true

      - name: Ejecutar validación integral
        shell: bash
        run: |
          set +e
          report=docs/.agent-final-validation-report.md
          : > "$report"
          all_passed=1
          run_check() {
            title="$1"
            shift
            echo "## $title" >> "$report"
            echo '```text' >> "$report"
            "$@" >> "$report" 2>&1
            code=$?
            echo '```' >> "$report"
            echo "Resultado: $code" >> "$report"
            echo >> "$report"
            if [ "$code" -ne 0 ]; then all_passed=0; fi
          }
          echo '# Validación integral de la bitácora UX' >> "$report"
          echo >> "$report"
          run_check "Formato" npm run format:check
          run_check "Lint" npm run lint
          run_check "Tipos" npm run typecheck
          run_check "Pruebas" npm run test
          run_check "Build" npm run build
          run_check "Verify" npm run verify
          if [ "$all_passed" -eq 1 ]; then
            cat > docs/.agent-final-validation-pass.md <<'EOF'
          # Validación automática aprobada

          Formato, lint, tipos, pruebas, build y verify finalizaron correctamente.
          EOF
            rm -f docs/.agent-final-validation-fail.md
          else
            cat > docs/.agent-final-validation-fail.md <<'EOF'
          # Validación automática pendiente

          Existe al menos una validación fallida. Revisa `.agent-final-validation-report.md`.
          EOF
            rm -f docs/.agent-final-validation-pass.md
          fi

      - name: Publicar consolidación y reporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore(ux): consolidar bloques y registrar validación integral"
          git push origin HEAD:version-1-1
