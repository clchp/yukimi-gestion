name: Format PR 32

on:
  push:
    branches:
      - fix/ui-action-release-v1-1-20260808

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-action-release-v1-1-20260808
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aplicar Prettier a archivos pendientes
        run: |
          npx prettier --write \
            apps/api/src/modules/products/products.routes.ts \
            apps/api/tests/sale-request-validation.test.ts \
            apps/web/src/app/delivery-cost-lock.ts \
            apps/web/src/app/delivery-detail-cost.ts \
            apps/web/src/app/delivery-expense-runtime.ts \
            apps/web/src/app/delivery-partner-options.ts \
            apps/web/src/app/delivery-partners-runtime.ts \
            apps/web/src/app/import-dni-management-runtime.ts \
            apps/web/src/app/import-final-polish.ts \
            apps/web/src/app/import-insurance-resolution-runtime.ts \
            apps/web/src/app/pending-workflow-enhancements.ts \
            apps/web/src/app/post-merge-review-fixes.ts \
            apps/web/src/app/product-report-runtime.ts \
            apps/web/src/app/sale-wizard-summary-enhancement.ts \
            apps/web/src/features/insights/file-export-v2.ts \
            apps/web/src/features/insights/file-export-xlsx.ts \
            apps/web/src/styles/ux-final-pending.css \
            apps/web/src/styles/ux-final-table-spacing.css \
            packages/shared/src/deliveries.ts \
            packages/shared/src/index.ts
      - name: Commit de formato
        run: |
          if git diff --quiet; then
            echo "No hay cambios de formato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/src/modules/products/products.routes.ts \
            apps/api/tests/sale-request-validation.test.ts \
            apps/web/src/app/delivery-cost-lock.ts \
            apps/web/src/app/delivery-detail-cost.ts \
            apps/web/src/app/delivery-expense-runtime.ts \
            apps/web/src/app/delivery-partner-options.ts \
            apps/web/src/app/delivery-partners-runtime.ts \
            apps/web/src/app/import-dni-management-runtime.ts \
            apps/web/src/app/import-final-polish.ts \
            apps/web/src/app/import-insurance-resolution-runtime.ts \
            apps/web/src/app/pending-workflow-enhancements.ts \
            apps/web/src/app/post-merge-review-fixes.ts \
            apps/web/src/app/product-report-runtime.ts \
            apps/web/src/app/sale-wizard-summary-enhancement.ts \
            apps/web/src/features/insights/file-export-v2.ts \
            apps/web/src/features/insights/file-export-xlsx.ts \
            apps/web/src/styles/ux-final-pending.css \
            apps/web/src/styles/ux-final-table-spacing.css \
            packages/shared/src/deliveries.ts \
            packages/shared/src/index.ts
          git commit -m "style: aplicar Prettier a archivos pendientes"
          git push origin HEAD:fix/ui-action-release-v1-1-20260808
