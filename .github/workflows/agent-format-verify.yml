name: Agent format verify script

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-format-verify.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatear verificador UX
        run: npx prettier --write scripts/verify-ux-contracts.mjs
      - name: Publicar corrección y retirar workflow temporal
        run: |
          rm -f .github/workflows/agent-format-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(ux): normalizar verificador con Prettier"
          git pull --rebase origin version-1-1
          git push origin HEAD:version-1-1
