name: Format import DNI adjustments temp

on:
  push:
    branches:
      - fix/import-dni-edit-and-purchase-base-v1-1-20260807

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-dni-edit-and-purchase-base-v1-1-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatear archivos del ajuste
        run: >-
          npx prettier --write
          apps/api/src/modules/imports/supabase-imports.repository.ts
          apps/web/src/app/import-dni-final-adjustments.ts
          packages/shared/src/import-dni.ts
      - name: Guardar formato
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/imports/supabase-imports.repository.ts apps/web/src/app/import-dni-final-adjustments.ts packages/shared/src/import-dni.ts
          git commit -m "style: formatea ajustes de gestión por DNI"
          git push origin HEAD:fix/import-dni-edit-and-purchase-base-v1-1-20260807
