name: Agent fix UX typecheck

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-fix-typecheck.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Corregir contratos TypeScript y formularios
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, transform):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              updated = transform(text)
              if updated == text:
                  print(f'Sin cambios en {path}')
              file.write_text(updated, encoding='utf-8')

          edit(
              'apps/web/src/components/ui/feedback-provider.tsx',
              lambda text: text.replace('  requestId?: string;\n', '  requestId?: string | undefined;\n'),
          )

          edit(
              'apps/web/src/components/ui/searchable-select.tsx',
              lambda text: text
                  .replace('  description?: string;\n', '  description?: string | undefined;\n')
                  .replace('  error?: string;\n', '  error?: string | undefined;\n'),
          )

          def fix_validation(text):
              text = text.replace(
                  "  if (validity.tooShort) return `${field} debe tener al menos ${control.minLength} caracteres.`;",
                  "  if (validity.tooShort) {\n    const minLength =\n      control instanceof HTMLInputElement || control instanceof HTMLTextAreaElement\n        ? control.minLength\n        : 0;\n    return `${field} debe tener al menos ${minLength} caracteres.`;\n  }",
              )
              text = text.replace(
                  "  if (validity.rangeUnderflow) return `${field} debe ser mayor o igual que ${control.min}.`;",
                  "  if (validity.rangeUnderflow) {\n    const min = control instanceof HTMLInputElement ? control.min : '';\n    return `${field} debe ser mayor o igual que ${min}.`;\n  }",
              )
              text = text.replace(
                  "  if (validity.rangeOverflow) return `${field} debe ser menor o igual que ${control.max}.`;",
                  "  if (validity.rangeOverflow) {\n    const max = control instanceof HTMLInputElement ? control.max : '';\n    return `${field} debe ser menor o igual que ${max}.`;\n  }",
              )
              return text

          edit('apps/web/src/components/ui/global-form-validation-bridge.tsx', fix_validation)

          edit(
              'apps/web/src/features/products/products-api.ts',
              lambda text: text
                  .replace('  search?: string;\n', '  search?: string | undefined;\n', 1)
                  .replace('  isActive?: boolean;\n', '  isActive?: boolean | undefined;\n', 1),
          )

          def normalize_prompt_values(text):
              return re.sub(
                  r'(?<![.A-Za-z0-9_])values\.([A-Za-z_][A-Za-z0-9_]*)',
                  r"(values.\1 ?? '')",
                  text,
              )

          for path in [
              'apps/web/src/pages/import-detail-page.tsx',
              'apps/web/src/pages/settings-page.tsx',
          ]:
              edit(path, normalize_prompt_values)

          def fix_new_import(text):
              text = text.replace(
                  '        description: `${variant.sku} · ${variant.availableQuantity} disponibles`,',
                  '        description: variant.sku,',
              )
              text = text.replace(
                  "        roleType: 'SUPPLIER',\n        name: values.name.trim(),\n        countryCode: values.countryCode.trim().toUpperCase(),\n        taxId: null,\n        contactName: values.contactName.trim() || null,\n        email: values.email.trim() || null,\n        phone: values.phone.trim() || null,\n        website: null,\n        notes: values.notes.trim() || null,",
                  "        partnerTypeCode: 'SUPPLIER',\n        legalName: values.name.trim(),\n        tradeName: values.name.trim(),\n        countryCode: values.countryCode.trim().toUpperCase(),\n        contactName: values.contactName.trim() || null,\n        email: values.email.trim() || null,\n        phone: values.phone.trim() || null,\n        notes: values.notes.trim() || null,",
              )
              text = text.replace('      supplierId,\n', '      supplierPartnerId: supplierId,\n', 1)
              text = text.replace(
                  "                              options={(support.data?.warehouses ?? [])\n                                .filter(\n                                  (warehouse) =>\n                                    warehouse.isActive && warehouse.isVisibleInOperations,\n                                )\n                                .map((warehouse) => ({",
                  "                              options={(support.data?.warehouses ?? []).map((warehouse) => ({",
              )
              return normalize_prompt_values(text)

          edit('apps/web/src/pages/new-import-page.tsx', fix_new_import)
          PY
      - name: Formatear archivos modificados
        run: |
          npx prettier --write \
            apps/web/src/components/ui/feedback-provider.tsx \
            apps/web/src/components/ui/searchable-select.tsx \
            apps/web/src/components/ui/global-form-validation-bridge.tsx \
            apps/web/src/features/products/products-api.ts \
            apps/web/src/pages/import-detail-page.tsx \
            apps/web/src/pages/new-import-page.tsx \
            apps/web/src/pages/settings-page.tsx
      - name: Ejecutar typecheck y guardar reporte
        shell: bash
        run: |
          set +e
          npm run build:shared > docs/.agent-typecheck-fix-report.txt 2>&1
          build_code=$?
          npm run typecheck >> docs/.agent-typecheck-fix-report.txt 2>&1
          type_code=$?
          echo >> docs/.agent-typecheck-fix-report.txt
          echo "build_shared_exit=$build_code" >> docs/.agent-typecheck-fix-report.txt
          echo "typecheck_exit=$type_code" >> docs/.agent-typecheck-fix-report.txt
          exit 0
      - name: Publicar correcciones
        run: |
          rm -f .github/workflows/agent-fix-typecheck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ux): corregir contratos TypeScript de formularios"
          git pull --rebase origin version-1-1
          git push origin HEAD:version-1-1
