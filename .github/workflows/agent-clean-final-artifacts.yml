name: Agent clean final artifacts

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-clean-final-artifacts.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Retirar archivos temporales y documentar validación
        run: |
          rm -f .github/workflows/agent-*.yml
          rm -f docs/.agent-*
          rm -f docs/.ux-validation-trigger docs/.ux-final-validation-trigger
          cat > docs/VALIDACION_FINAL_UX_V1_1.md <<'EOF'
          # Validación final — Yukimi Gestión v1.1

          Fecha de validación: 30 de julio de 2026.

          ## Alcance

          La bitácora UX y las reglas operativas se implementaron exclusivamente en la rama `version-1-1`. La rama `main` no fue fusionada ni modificada por este proceso.

          ## Validación automatizada

          GitHub Actions, ejecución `30602538916`:

          - Lint: aprobado.
          - Prettier: aprobado.
          - Compilación del paquete compartido: aprobada.
          - TypeScript en shared, API y web: aprobado.
          - Pruebas Node/API: 13 de 13 aprobadas.
          - Validación estática de migraciones: 44 migraciones con versiones únicas.
          - Validación estática de pgTAP: 12 archivos coherentes.
          - Contratos UI y responsive: aprobados.
          - Validación de cumplimiento: aprobada.
          - Build completo de shared, API y web: aprobado.

          ## Base de datos temporal

          - Migraciones `000` a `043` aplicadas desde cero en Supabase local.
          - 12 archivos pgTAP, 84 pruebas: aprobadas.
          - Concurrencia: creación idempotente única y una sola actualización optimista ganadora.
          - Supabase DB lint: sin errores de nivel error en los esquemas `public` y `private`.

          ## Controles relevantes

          - Borradores de venta permiten cliente y productos pendientes, pero la confirmación final los exige.
          - Recepciones y cancelaciones de importación son atómicas y auditadas.
          - Una caja no puede quedar ingresada a stock con cero unidades recibidas.
          - Las recepciones históricas inconsistentes tienen una corrección controlada.
          - Los movimientos de inventario conservan motivo, validaciones y auditoría.
          - Las etiquetas QR pueden visualizarse, imprimirse y descargarse en PNG.

          ## Despliegue

          La validación no modifica el proyecto remoto de Supabase ni despliega la aplicación. Las migraciones remotas deben revisarse primero con `supabase migration list` y `supabase db push --dry-run`.
          EOF
      - name: Verificar estado limpio
        run: npm run verify
      - name: Publicar limpieza final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: limpiar artefactos temporales y registrar validación final"
          git pull --rebase origin version-1-1
          git push origin HEAD:version-1-1
