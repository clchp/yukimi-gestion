name: Format import DNI temp

on:
  push:
    branches:
      - feat/import-dni-management-v1-1-20260807

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-dni-management-v1-1-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatear archivos del cambio
        run: >-
          npx prettier --write
          apps/api/src/modules/imports/imports.repository.ts
          apps/api/src/modules/imports/imports.routes.ts
          apps/api/src/modules/imports/imports.service.ts
          apps/api/src/modules/imports/supabase-imports.repository.ts
          apps/web/src/app/import-dni-management-runtime.ts
          apps/web/src/features/imports/imports-api.ts
          apps/web/src/main.tsx
          apps/web/src/styles/ux-import-dni.css
          packages/shared/src/import-dni.ts
          packages/shared/src/index.ts
          supabase/migrations/051_import_dni_management.sql
          supabase/tests/database/019_import_dni_management.test.sql
      - name: Guardar formato
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/imports apps/web/src/app/import-dni-management-runtime.ts apps/web/src/features/imports/imports-api.ts apps/web/src/main.tsx apps/web/src/styles/ux-import-dni.css packages/shared/src/import-dni.ts packages/shared/src/index.ts supabase/migrations/051_import_dni_management.sql supabase/tests/database/019_import_dni_management.test.sql
          git commit -m "style: formatea gestión de importaciones por DNI"
          git push origin HEAD:feat/import-dni-management-v1-1-20260807
