name: Format import smart workflow

on:
  push:
    branches: [feat/import-smart-workflow-v1-1-20260806]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-smart-workflow-v1-1-20260806
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatear archivos del nuevo flujo
        run: >-
          npx prettier --write
          apps/web/src/app/import-smart-workflow.ts
          apps/web/src/styles/ux-import-smart-workflow.css
          apps/web/src/main.tsx
          apps/web/src/styles/global.css
      - name: Guardar formato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/import-smart-workflow.ts apps/web/src/styles/ux-import-smart-workflow.css apps/web/src/main.tsx apps/web/src/styles/global.css
          if ! git diff --cached --quiet; then
            git commit -m "style(imports): formatea el flujo inteligente"
            git push origin HEAD:feat/import-smart-workflow-v1-1-20260806
          fi
