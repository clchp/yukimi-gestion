name: Corregir PR temporal

on:
  pull_request:
    branches: [version-1-1]
    paths:
      - '.github/workflows/fix-pr-temporal.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Corregir carga del detalle del producto
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/runtime-ux-enhancements.ts')
          text = path.read_text()
          old = """    const [product, inventory] = await Promise.all([\n      getProduct(productId),\n      getInventory({ search: product.code, includeVirtual: false }),\n    ]);"""
          new = """    const product = await getProduct(productId);\n    const inventory = await getInventory({ search: product.code, includeVirtual: false });"""
          if old not in text:
              raise SystemExit('No se encontró el bloque esperado')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write apps/web/src/app/runtime-ux-enhancements.ts
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/runtime-ux-enhancements.ts
          git commit -m "fix(products): cargar detalle antes del inventario"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
