name: Apply Yukimi v1.1

on:
  push:
    branches: [version-1-1]
    paths:
      - .agent-upload/READY

permissions:
  contents: write

concurrency:
  group: apply-yukimi-v1-1
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar mejoras verificadas
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/apply.log) 2>&1
          : > /tmp/yukimi-delta.b64
          while read -r expected_sha file; do
            [ -n "$expected_sha" ] || continue
            test -f "$file"
            actual_sha="$(git hash-object "$file")"
            echo "$file expected=$expected_sha actual=$actual_sha"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::El segmento $file no coincide con el original."
              exit 1
            fi
            cat "$file" >> /tmp/yukimi-delta.b64
          done < .agent-upload/MANIFEST
          actual_characters="$(wc -c < /tmp/yukimi-delta.b64)"
          if [ "$actual_characters" -ne 108272 ]; then
            echo "::error::El paquete reconstruido tiene $actual_characters caracteres; se esperaban 108272."
            exit 1
          fi
          base64 --decode /tmp/yukimi-delta.b64 > /tmp/yukimi-delta.tar.xz
          echo "efef34a615d760d60deb69debc21c67ea82f4c118d6b2e293b721f3b74048a19  /tmp/yukimi-delta.tar.xz" | sha256sum -c -
          xz -t /tmp/yukimi-delta.tar.xz
          tar -xJf /tmp/yukimi-delta.tar.xz -C .
          rsync -a .agent-upload/fixes/ ./
          rm -rf .agent-upload .github/workflows/agent-apply-version.yml
      - name: Instalar dependencias
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/install.log
      - name: Formatear cambios
        id: format
        shell: bash
        run: |
          set -o pipefail
          npm run format 2>&1 | tee /tmp/format.log
      - name: Validar aplicación completa
        id: verify
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/verify.log
      - name: Iniciar Supabase local
        id: db_start
        shell: bash
        run: |
          set -o pipefail
          npm run db:start 2>&1 | tee /tmp/db-start.log
      - name: Validar base de datos en Supabase local
        id: db_test
        shell: bash
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee /tmp/db-test.log
      - name: Detener Supabase local
        if: always()
        run: npm run db:stop
      - name: Registrar diagnóstico de fallo
        if: failure() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-upload
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "apply=${{ steps.apply.outcome }}"
            echo "install=${{ steps.install.outcome }}"
            echo "format=${{ steps.format.outcome }}"
            echo "verify=${{ steps.verify.outcome }}"
            echo "db_start=${{ steps.db_start.outcome }}"
            echo "db_test=${{ steps.db_test.outcome }}"
            for log in /tmp/apply.log /tmp/install.log /tmp/format.log /tmp/verify.log /tmp/db-start.log /tmp/db-test.log; do
              if [ -f "$log" ]; then
                echo
                echo "===== $log ====="
                tail -n 120 "$log"
              fi
            done
          } > .agent-upload/FAILURE
          git config user.name "Yukimi Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .agent-upload/FAILURE
          git commit -m "Record Yukimi v1.1 validation failure"
          git push origin HEAD:version-1-1
      - name: Publicar versión validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yukimi Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete Yukimi Gestión v1.1 requirements"
          git push origin HEAD:version-1-1
