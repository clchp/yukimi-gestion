name: Normalize UX implementation

on:
  push:
    branches:
      - version-1-1
    paths:
      - .github/workflows/agent-normalize-ux.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Corregir detalles mecánicos
        run: |
          python - <<'PY'
          from pathlib import Path

          label = Path('apps/web/src/features/products/product-label.ts')
          text = label.read_text(encoding='utf-8').replace(r'<\/script>', '</script>')
          label.write_text(text, encoding='utf-8')

          inventory = Path('apps/web/src/pages/inventory-page.tsx')
          text = inventory.read_text(encoding='utf-8')
          text = text.replace('  ArrowLeftRight,\n', '')
          text = text.replace("import { useNavigate, useSearchParams } from 'react-router';", "import { useSearchParams } from 'react-router';")
          text = text.replace('  const navigate = useNavigate();\n', '')
          inventory.write_text(text, encoding='utf-8')
          PY
      - name: Aplicar Prettier
        run: |
          npx prettier --write \
            apps/web/src/app/api-client.ts \
            apps/web/src/main.tsx \
            apps/web/src/components/ui/feedback-provider.tsx \
            apps/web/src/components/ui/searchable-select.tsx \
            apps/web/src/components/ui/filter-panel.tsx \
            apps/web/src/components/ui/info-tip.tsx \
            apps/web/src/features/admin/admin-api.ts \
            apps/web/src/features/products/product-label.ts \
            apps/web/src/features/products/products-api.ts \
            apps/web/src/pages/dashboard-page.tsx \
            apps/web/src/pages/settings-page.tsx \
            apps/web/src/pages/products-page.tsx \
            apps/web/src/pages/product-detail-page.tsx \
            apps/web/src/pages/edit-product-page.tsx \
            apps/web/src/pages/inventory-page.tsx \
            apps/web/src/styles/global.css \
            apps/web/src/styles/ux.css \
            apps/web/src/styles/ux-dashboard.css \
            apps/web/src/styles/ux-products.css \
            apps/api/src/modules/admin/supabase-admin.repository.ts \
            apps/api/src/modules/products/products.repository.ts \
            apps/api/src/modules/products/products.service.ts \
            apps/api/src/modules/products/products.routes.ts \
            apps/api/src/modules/products/supabase-products.repository.ts \
            packages/shared/src/product-maintenance.ts \
            packages/shared/src/index.ts \
            supabase/migrations/037_product_maintenance_and_ux_integrity.sql \
            docs/UX_IMPLEMENTATION_STATUS.md
      - name: Publicar normalización
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(ux): normalizar implementación y resolver lint mecánico"
          git push origin HEAD:version-1-1
