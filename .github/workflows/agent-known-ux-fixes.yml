name: Agent known UX fixes

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-known-ux-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aplicar correcciones conocidas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # La migración parcial no debe depender del nombre de una tabla secundaria.
          Path('supabase/migrations/041_partial_sale_drafts.sql').write_text("""-- Yukimi Gestión
          -- Migración 041: los borradores pueden guardarse sin cliente mientras no se confirmen.

          begin;

          alter table public.sale_drafts
            alter column client_id drop not null;

          comment on column public.sale_drafts.client_id is
            'Cliente opcional mientras el registro sea un borrador. La venta final exige un cliente válido.';

          notify pgrst, 'reload schema';

          commit;
          """.replace('          ', ''), encoding='utf-8')

          # Relaja únicamente los esquemas cuyo nombre contiene draft/borrador.
          sales = Path('packages/shared/src/sales.ts')
          text = sales.read_text(encoding='utf-8')
          declarations = list(re.finditer(r'export const\s+([A-Za-z0-9_]*(?:draft|borrador)[A-Za-z0-9_]*)\s*=', text, re.I))
          for index in range(len(declarations) - 1, -1, -1):
              match = declarations[index]
              start = match.start()
              end = declarations[index + 1].start() if index + 1 < len(declarations) else len(text)
              block = text[start:end]
              block = re.sub(
                  r'clientId:\s*z\.string\(\)\.uuid\(\)(?!\.(?:nullable|optional))',
                  "clientId: z.preprocess((value) => value === '' ? null : value, z.string().uuid().nullable().optional())",
                  block,
              )
              block = re.sub(r'(items|lines):\s*z\.array\(([^\n;]+)\)\.min\(1(?:,[^)]*)?\)', r'\1: z.array(\2).default([])', block)
              block = re.sub(r'(items|lines):\s*z\.array\(([^\n;]+)\)\.nonempty\([^)]*\)', r'\1: z.array(\2).default([])', block)
              text = text[:start] + block + text[end:]
          sales.write_text(text, encoding='utf-8')

          # Corrige la etiqueta para que el SVG interno no conserve un tamaño de 1px.
          label = Path('apps/web/src/features/products/product-label.ts')
          text = label.read_text(encoding='utf-8')
          text = text.replace("const qr = qrSvg(payload, 1);", "const qr = qrSvg(payload, 348);")
          text = text.replace(
              "const nestedQr = qr.replace(\n    '<svg ',\n    '<svg x=\"66\" y=\"122\" width=\"348\" height=\"348\" preserveAspectRatio=\"xMidYMid meet\" ',\n  );",
              "const nestedQr = qr.replace('<svg ', '<svg x=\"66\" y=\"122\" preserveAspectRatio=\"xMidYMid meet\" ');",
          )
          text = text.replace(r'<\/script>', '</script>')
          label.write_text(text, encoding='utf-8')

          # Elimina la regla antigua cuadrada que deformaba la etiqueta nueva.
          global_css = Path('apps/web/src/styles/global.css')
          text = global_css.read_text(encoding='utf-8')
          text = re.sub(r'\n\.qr-label-preview\s*\{.*?\.qr-label-payload\s*\{.*?\}\s*$', '\n', text, flags=re.S)
          global_css.write_text(text, encoding='utf-8')

          # La edición de productos debe proporcionar el motivo a los triggers de auditoría.
          migration = Path('supabase/migrations/037_product_maintenance_and_ux_integrity.sql')
          text = migration.read_text(encoding='utf-8')
          marker = "  v_old_product := to_jsonb(v_product);"
          if marker in text and "app.audit_reason" not in text:
              text = text.replace(marker, "  perform pg_catalog.set_config('app.audit_reason', v_reason, true);\n\n" + marker)
          if "notify pgrst" not in text:
              text = text.replace("\ncommit;\n", "\nnotify pgrst, 'reload schema';\n\ncommit;\n")
          migration.write_text(text, encoding='utf-8')

          # Limpieza de imports conocidos.
          inventory = Path('apps/web/src/pages/inventory-page.tsx')
          text = inventory.read_text(encoding='utf-8')
          text = text.replace('  ArrowLeftRight,\n', '')
          text = text.replace("import { useNavigate, useSearchParams } from 'react-router';", "import { useSearchParams } from 'react-router';")
          text = text.replace('  const navigate = useNavigate();\n', '')
          inventory.write_text(text, encoding='utf-8')
          PY
      - name: Formatear archivos de código
        run: |
          git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' '*.css' '*.md' '*.json' '*.yml' '*.yaml' | xargs npx prettier --write
      - name: Publicar correcciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "fix(ux): corregir etiqueta, auditoría y borradores parciales"
          git push origin HEAD:version-1-1
