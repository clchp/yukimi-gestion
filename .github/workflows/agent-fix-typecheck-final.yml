name: Agent final typecheck fix

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-fix-typecheck-final.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Corregir valor JSON opcional
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/settings-page.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('JSON.parse(form.value);', "JSON.parse(form.value ?? '');")
          path.write_text(text, encoding='utf-8')
          PY
          npx prettier --write apps/web/src/pages/settings-page.tsx
      - name: Validar tipos
        run: |
          npm run build:shared
          npm run typecheck
      - name: Publicar corrección
        run: |
          rm -f .github/workflows/agent-fix-typecheck-final.yml
          rm -f docs/.agent-typecheck-fix-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ux): completar validación TypeScript"
          git pull --rebase origin version-1-1
          git push origin HEAD:version-1-1
