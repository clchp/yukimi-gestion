name: Agent validate UX implementation

on:
  push:
    branches: [version-1-1]
    paths:
      - .github/workflows/agent-validate-ux.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Normalizar archivos de código y documentación
        run: |
          python - <<'PY'
          from pathlib import Path
          label = Path('apps/web/src/features/products/product-label.ts')
          if label.exists():
              label.write_text(label.read_text(encoding='utf-8').replace(r'<\/script>', '</script>'), encoding='utf-8')
          inventory = Path('apps/web/src/pages/inventory-page.tsx')
          if inventory.exists():
              text = inventory.read_text(encoding='utf-8')
              text = text.replace('  ArrowLeftRight,\n', '')
              text = text.replace("import { useNavigate, useSearchParams } from 'react-router';", "import { useSearchParams } from 'react-router';")
              text = text.replace('  const navigate = useNavigate();\n', '')
              inventory.write_text(text, encoding='utf-8')
          PY
          git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' '*.css' '*.md' '*.json' '*.yml' '*.yaml' | xargs npx prettier --write
      - name: Ejecutar validaciones y guardar reporte
        shell: bash
        run: |
          set +e
          report=docs/.agent-verify-report.txt
          : > "$report"
          run_check() {
            title="$1"
            shift
            echo "## $title" >> "$report"
            echo '```text' >> "$report"
            "$@" >> "$report" 2>&1
            code=$?
            echo '```' >> "$report"
            echo "exit_code=$code" >> "$report"
            echo >> "$report"
            return 0
          }
          run_check "format" npm run format:check
          run_check "lint" npm run lint
          run_check "typecheck" npm run typecheck
          run_check "tests" npm run test
          run_check "build" npm run build
          run_check "verify" npm run verify
      - name: Publicar formato y reporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore(ux): normalizar y registrar validación automática"
          git push origin HEAD:version-1-1
