name: Yukimi CI

on:
  push:
    branches: [main, version-1-1]
  pull_request:
    branches: [main, version-1-1]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Mostrar diferencias de formato del gráfico
        run: |
          npx prettier apps/web/src/app/finance-reports-smart-charts.ts > /tmp/finance-reports-smart-charts.ts
          diff -u apps/web/src/app/finance-reports-smart-charts.ts /tmp/finance-reports-smart-charts.ts || true
      - run: npm run format:check
        continue-on-error: true
      - run: npm run build:shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:migrations:static
      - run: npm run test:db:static
      - run: npm run test:ui:static
      - run: npm run test:compliance:static
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Iniciar Supabase local
        run: npm run db:start
      - name: Aplicar migraciones y ejecutar pruebas de base de datos
        run: npm run test:db
      - name: Detener Supabase local
        if: always()
        run: npm run db:stop
